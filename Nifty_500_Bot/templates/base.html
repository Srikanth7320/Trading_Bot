<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Ensures proper scaling on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nifty 500 Paper Trading Bot</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Mobile-friendly adjustments */
        body {
            font-size: 0.95rem;
        }
        @media (max-width: 768px) {
            h2 {
                font-size: 1.5rem;
            }
            .table th, .table td {
                white-space: nowrap; /* Prevents text wrapping issues inside tables on mobile */
            }
        }
    </style>
</head>
<body class="bg-light">
    <!-- Responsive Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">📈 Nifty 500 Bot</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto py-2">
                    <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/active">Active Stocks</a></li>
                    <li class="nav-item"><a class="nav-link" href="/sold">Sold Stocks</a></li>
                    <li class="nav-item"><a class="nav-link" href="/cooling">Cooling Period</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Container with Responsive Padding -->
    <div class="container py-3 py-md-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
